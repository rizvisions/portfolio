<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f2f2" />
  <title>Rizvisions</title>
  <meta name="description" content="The internet home of Riz Zaheer — work, photography, projects, notes, and whatever else." />
  <link rel="icon" href="assets/icons/macos/rizvisions.png" />
  <link rel="stylesheet" href="styles.css?v=7" />
</head>
<body>
  <div id="os" class="os" data-wallpaper="grid">
    <header class="menu-bar" aria-label="Menu bar">
      <div class="menu-left">
        <button class="brand-menu menu-trigger" data-menu="riz-menu" aria-label="Rizvisions menu">
          <img src="assets/icons/macos/rizvisions.png" alt="" draggable="false" />
        </button>
        <span class="active-app-name" id="activeAppName">Rizvisions</span>
        <button class="menu-trigger" data-menu="file-menu">File</button>
        <button class="menu-trigger" data-menu="edit-menu">Edit</button>
        <button class="menu-trigger" data-menu="view-menu">View</button>
        <button class="menu-trigger" data-menu="go-menu">Go</button>
        <button class="menu-trigger" data-menu="window-menu">Window</button>
        <button class="menu-trigger" data-menu="help-menu">Help</button>
      </div>
      <div class="menu-right">
        <button class="status-button" id="spotlightButton" aria-label="Spotlight Search" title="Spotlight Search (⌘ Space)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"></circle><path d="m15 15 4.7 4.7"></path></svg>
        </button>
        <button class="status-button" id="soundStatus" aria-label="Sound on" title="Sound">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4Zm12.4-1.5a6 6 0 0 1 0 9M18.8 5a10 10 0 0 1 0 14"/></svg>
        </button>
        <span class="status-item wifi" aria-label="Wi-Fi connected">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5a14 14 0 0 1 18 0M6.5 12a9 9 0 0 1 11 0M10 15.5a4 4 0 0 1 4 0M12 19h.01"/></svg>
        </span>
        <span class="status-item weather-status" id="weatherStatus" title="Chicago weather">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .3-8A6 6 0 0 0 6 9.3 4.5 4.5 0 0 0 7 18Z"/></svg>
          <span id="weatherTemp">—°</span>
        </span>
        <button class="status-item control-center" id="controlCenterButton" aria-label="Control Center">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M8 14v6"/></svg>
        </button>
        <button class="clock-button" id="clockButton" aria-label="Open Notification Center"><time class="clock" id="clock">Wed Aug 5 1:29 AM</time></button>
      </div>
    </header>

    <div class="menu-popover" id="riz-menu" role="menu">
      <button role="menuitem" data-action="open-about"><strong>About Rizvisions</strong></button>
      <div class="menu-separator"></div>
      <button role="menuitem" data-action="open-settings">System Settings…</button>
      <div class="menu-separator"></div>
      <button role="menuitem" data-action="reset-os">Reset Rizvisions…</button>
    </div>
    <div class="menu-popover" id="file-menu" role="menu">
      <button role="menuitem" data-app="work">New Finder Window <kbd>⌘N</kbd></button>
      <button role="menuitem" data-app="notes">New Note <kbd>⌘⇧N</kbd></button>
      <div class="menu-separator"></div>
      <button role="menuitem" data-action="close-active">Close Window <kbd>⌘W</kbd></button>
    </div>
    <div class="menu-popover" id="edit-menu" role="menu">
      <button role="menuitem" disabled>Undo <kbd>⌘Z</kbd></button>
      <button role="menuitem" disabled>Redo <kbd>⇧⌘Z</kbd></button>
      <div class="menu-separator"></div>
      <button role="menuitem" disabled>Cut <kbd>⌘X</kbd></button>
      <button role="menuitem" disabled>Copy <kbd>⌘C</kbd></button>
      <button role="menuitem" disabled>Paste <kbd>⌘V</kbd></button>
    </div>
    <div class="menu-popover" id="view-menu" role="menu">
      <button role="menuitem" data-wallpaper="grid"><span class="menu-check" data-check="grid">✓</span> Grid Wallpaper</button>
      <button role="menuitem" data-wallpaper="chicago"><span class="menu-check" data-check="chicago"></span> Chicago Wallpaper</button>
      <button role="menuitem" data-wallpaper="dark"><span class="menu-check" data-check="dark"></span> Dark Wallpaper</button>
      <div class="menu-separator"></div>
      <button role="menuitem" data-action="reset-layout">Restore Default Layout</button>
    </div>
    <div class="menu-popover" id="go-menu" role="menu">
      <button role="menuitem" data-app="about">About Riz</button>
      <button role="menuitem" data-app="work">Selected Work</button>
      <button role="menuitem" data-app="photos">Photos</button>
      <button role="menuitem" data-app="reel">Live Reel</button>
      <button role="menuitem" data-app="instagram">Instagram</button>
      <button role="menuitem" data-app="spotify">Spotify</button>
    </div>
    <div class="menu-popover" id="window-menu" role="menu">
      <button role="menuitem" data-action="minimize-active">Minimize <kbd>⌘M</kbd></button>
      <button role="menuitem" data-action="zoom-active">Zoom</button>
      <div class="menu-separator"></div>
      <button role="menuitem" data-action="bring-all-front">Bring All to Front</button>
    </div>
    <div class="menu-popover" id="help-menu" role="menu">
      <button role="menuitem" data-app="about">Rizvisions Help</button>
      <div class="menu-separator"></div>
      <button role="menuitem" data-action="show-shortcuts">Keyboard Shortcuts</button>
    </div>

    <div class="desktop" id="desktop" tabindex="-1">
      <div class="wallpaper wallpaper-grid" aria-hidden="true">
        <div class="watermark"><span>RIZ</span><span>VISIONS</span></div>
      </div>
      <div class="wallpaper wallpaper-chicago" aria-hidden="true"></div>
      <div class="wallpaper wallpaper-dark" aria-hidden="true">
        <div class="dark-orb dark-orb-a"></div><div class="dark-orb dark-orb-b"></div>
      </div>

      <section class="now-widget" id="currentWidget" aria-label="Currently" title="Drag to move">
        <div class="now-copy">
          <span class="eyebrow" id="widgetEyebrow">CURRENTLY</span>
          <strong id="widgetTitle">Parker</strong>
          <span class="now-sub" id="widgetSubtitle">AI creative strategy</span>
        </div>
        <div class="now-actions">
          <button id="widgetShow" type="button">Show</button>
          <button id="widgetNext" type="button" class="muted">Next</button>
        </div>
        <div class="widget-progress" id="widgetProgress" aria-hidden="true"></div>
      </section>

      <div class="desktop-icons" id="desktopIcons" aria-label="Desktop items">
        <button class="desktop-item" data-id="about" data-app="about" style="--x: 36.1%; --y: 24.8%;">
          <span class="icon-frame"><img src="assets/icons/macos/rizvisions.png" alt="" draggable="false" /></span>
          <span class="desktop-label">About Riz</span>
        </button>
        <button class="desktop-item" data-id="work" data-app="work" style="--x: 44.4%; --y: 24.8%;">
          <span class="icon-frame icon-folder"><img src="assets/icons/macos/folder.png" alt="" draggable="false" /></span>
          <span class="desktop-label">Selected Work</span>
        </button>
        <button class="desktop-item" data-id="settings" data-app="about" style="--x: 52.6%; --y: 24.8%;">
          <span class="icon-frame"><img src="assets/icons/macos/settings.png" alt="" draggable="false" /></span>
          <span class="desktop-label">About + Links</span>
        </button>
        <button class="desktop-item" data-id="messages" data-app="messages" style="--x: 60.8%; --y: 24.8%;">
          <span class="icon-frame"><img src="assets/icons/macos/messages.png" alt="" draggable="false" /><span class="notification-badge">1</span></span>
          <span class="desktop-label">Message Riz</span>
        </button>
        <button class="desktop-item" data-id="photos" data-app="photos" style="--x: 36.1%; --y: 40.9%;">
          <span class="icon-frame"><img src="assets/icons/macos/photos.png" alt="" draggable="false" /></span>
          <span class="desktop-label">Photos</span>
        </button>
        <button class="desktop-item" data-id="resume" data-app="resume" style="--x: 44.4%; --y: 40.9%;">
          <span class="icon-frame icon-document"><img src="assets/icons/macos/document.png" alt="" draggable="false" /></span>
          <span class="desktop-label">Resume.pdf</span>
        </button>
        <button class="desktop-item" data-id="calendar" data-app="calendar" style="--x: 52.6%; --y: 40.9%;">
          <span class="icon-frame calendar-icon" aria-hidden="true"><span class="calendar-weekday">WED</span><span class="calendar-day">5</span></span>
          <span class="desktop-label">Coffee Chat</span>
        </button>
        <button class="desktop-item" data-id="instagram" data-app="instagram" style="--x: 60.8%; --y: 40.9%;">
          <span class="icon-frame"><img src="assets/icons/macos/instagram.png" alt="" draggable="false" /></span>
          <span class="desktop-label">Instagram</span>
        </button>
        <button class="desktop-item" data-id="trash" data-app="trash" style="--x: 44.4%; --y: 57.1%;">
          <span class="icon-frame icon-trash"><img src="assets/icons/macos/trash.png" alt="" draggable="false" /></span>
          <span class="desktop-label">Trash</span>
        </button>
        <button class="desktop-item" data-id="terminal" data-app="terminal" style="--x: 52.6%; --y: 57.1%;">
          <span class="icon-frame"><img src="assets/icons/macos/terminal.png" alt="" draggable="false" /></span>
          <span class="desktop-label">Terminal</span>
        </button>
        <button class="desktop-item" data-id="spotify" data-app="spotify" style="--x: 60.8%; --y: 57.1%;">
          <span class="icon-frame"><img src="assets/icons/macos/spotify.png" alt="" draggable="false" /></span>
          <span class="desktop-label">Spotify</span>
        </button>
      </div>

      <aside class="photo-stack" id="desktopPhotos" aria-label="Photography files"></aside>

      <div class="windows" id="windows" aria-live="polite"></div>

      <nav class="dock-wrap" aria-label="Dock">
        <div class="dock" id="dock">
          <button class="dock-item" data-app="work" data-tooltip="Finder"><img src="assets/icons/macos/finder.png" alt="Finder" draggable="false" /><span class="running-dot"></span></button>
          <button class="dock-item" data-app="work" data-tooltip="Selected Work"><img src="assets/icons/macos/folder.png" alt="Selected Work" draggable="false" /></button>
          <button class="dock-item" data-app="photos" data-tooltip="Photos"><img src="assets/icons/macos/photos.png" alt="Photos" draggable="false" /></button>
          <button class="dock-item" data-app="about" data-tooltip="About Riz"><img src="assets/icons/macos/rizvisions.png" alt="About Riz" draggable="false" /></button>
          <button class="dock-item" data-app="messages" data-tooltip="Messages"><img src="assets/icons/macos/messages.png" alt="Messages" draggable="false" /><span class="notification-badge dock-badge">1</span></button>
          <button class="dock-item dock-calendar" data-app="calendar" data-tooltip="Calendar"><span class="calendar-icon"><span class="calendar-weekday">WED</span><span class="calendar-day">5</span></span></button>
          <span class="dock-separator" aria-hidden="true"></span>
          <div class="minimized-dock" id="minimizedDock" aria-label="Minimized windows"></div>
          <button class="dock-item" data-app="notes" data-tooltip="Notes"><img src="assets/icons/macos/notes.png" alt="Notes" draggable="false" /></button>
          <button class="dock-item" data-app="terminal" data-tooltip="Terminal"><img src="assets/icons/macos/terminal.png" alt="Terminal" draggable="false" /></button>
          <button class="dock-item" data-app="spotify" data-tooltip="Spotify"><img src="assets/icons/macos/spotify.png" alt="Spotify" draggable="false" /></button>
          <button class="dock-item trash-dock" data-app="trash" data-tooltip="Trash"><img src="assets/icons/macos/trash.png" alt="Trash" draggable="false" /></button>
        </div>
      </nav>

      <div class="context-menu" id="desktopContextMenu" role="menu">
        <button role="menuitem" data-action="open-spotlight">Spotlight Search <kbd>⌘Space</kbd></button>
        <button role="menuitem" data-app="reel">Open Live Reel</button>
        <button role="menuitem" data-app="work">New Finder Window</button>
        <button role="menuitem" data-app="notes">New Note</button>
        <div class="menu-separator"></div>
        <button role="menuitem" data-action="sort-icons">Sort Icons</button>
        <button role="menuitem" data-action="cycle-wallpaper">Change Wallpaper</button>
        <div class="menu-separator"></div>
        <button role="menuitem" data-action="desktop-info">Get Info</button>
        <button role="menuitem" data-action="reset-layout">Restore Default Layout</button>
      </div>

      <div class="context-menu" id="photoContextMenu" role="menu">
        <button role="menuitem" data-action="quick-look-photo">Quick Look <kbd>Space</kbd></button>
        <button role="menuitem" data-app="photos">Open in Photos</button>
        <div class="menu-separator"></div>
        <button role="menuitem" data-action="bring-photo-front">Bring to Front</button>
        <button role="menuitem" data-action="reset-photo-position">Put Back</button>
      </div>

      <div class="control-center-panel" id="controlCenterPanel" aria-hidden="true">
        <div class="cc-grid">
          <button class="cc-tile active"><span class="cc-icon">⌁</span><span><strong>Wi‑Fi</strong><small>Home</small></span></button>
          <button class="cc-tile active"><span class="cc-icon">ᛒ</span><span><strong>Bluetooth</strong><small>On</small></span></button>
          <button class="cc-tile" id="ccFocus"><span class="cc-icon">☾</span><span><strong>Focus</strong><small id="ccFocusLabel">Off</small></span></button>
          <button class="cc-tile" id="ccSound"><span class="cc-icon">◖</span><span><strong>Sound</strong><small id="ccSoundLabel">On</small></span></button>
        </div>
        <label class="cc-slider"><span>Display</span><input id="brightnessSlider" type="range" min="45" max="100" value="100" /></label>
        <label class="cc-slider"><span>Sound</span><input id="volumeSlider" type="range" min="0" max="100" value="54" /></label>
        <div class="cc-wallpapers" aria-label="Wallpaper shortcuts">
          <button type="button" data-wallpaper="grid" aria-label="Grid wallpaper"><span class="cc-wallpaper-preview grid"></span>Grid</button>
          <button type="button" data-wallpaper="chicago" aria-label="Chicago wallpaper"><span class="cc-wallpaper-preview chicago"></span>Chicago</button>
          <button type="button" data-wallpaper="dark" aria-label="Dark wallpaper"><span class="cc-wallpaper-preview dark"></span>Dark</button>
        </div>
      </div>

      <aside class="notification-center" id="notificationCenter" aria-hidden="true">
        <section class="nc-calendar-card">
          <div class="nc-date"><span id="ncWeekday">Wednesday</span><strong id="ncDay">5</strong></div>
          <div class="nc-month" id="ncMonth">August 2026</div>
          <div class="nc-mini-grid" id="ncMiniGrid" aria-label="Current month"></div>
        </section>
        <section class="nc-weather-card">
          <div class="nc-weather-top"><span><small>Chicago</small><strong id="ncWeatherTemp">—°</strong></span><span class="nc-weather-icon" id="ncWeatherIcon">☁︎</span></div>
          <div class="nc-weather-summary" id="ncWeatherSummary">Loading Chicago weather…</div>
          <div class="nc-weather-stats"><span>Feels like <strong id="ncFeels">—°</strong></span><span>High <strong id="ncHigh">—°</strong></span><span>Low <strong id="ncLow">—°</strong></span></div>
        </section>
        <section class="nc-now-card">
          <span class="eyebrow">CURRENTLY</span>
          <strong id="ncCurrentTitle">Parker</strong>
          <p id="ncCurrentSubtitle">AI creative strategy</p>
          <button type="button" data-action="show-current-card">Open</button>
        </section>
      </aside>

      <div class="spotlight-backdrop" id="spotlightBackdrop" aria-hidden="true">
        <section class="spotlight-panel" role="dialog" aria-modal="true" aria-label="Spotlight Search">
          <div class="spotlight-search-row">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.2"></circle><path d="m15 15 4.7 4.7"></path></svg>
            <input id="spotlightInput" type="search" autocomplete="off" spellcheck="false" placeholder="Spotlight Search" aria-label="Spotlight Search" />
            <kbd>esc</kbd>
          </div>
          <div class="spotlight-results" id="spotlightResults"></div>
          <footer class="spotlight-footer"><span>↑↓ navigate</span><span>↵ open</span></footer>
        </section>
      </div>

      <div class="quicklook-backdrop" id="quickLookBackdrop" aria-hidden="true">
        <section class="quicklook-panel" role="dialog" aria-modal="true" aria-label="Quick Look">
          <header class="quicklook-toolbar">
            <button type="button" class="quicklook-close" id="quickLookClose" aria-label="Close Quick Look"></button>
            <span id="quickLookTitle">photo.jpg</span>
            <button type="button" class="quicklook-open-photos" data-app="photos">Open with Photos</button>
          </header>
          <div class="quicklook-stage">
            <button type="button" class="quicklook-nav previous" id="quickLookPrev" aria-label="Previous photo">‹</button>
            <img id="quickLookImage" alt="" draggable="false" />
            <button type="button" class="quicklook-nav next" id="quickLookNext" aria-label="Next photo">›</button>
          </div>
          <footer class="quicklook-meta" id="quickLookMeta"></footer>
        </section>
      </div>

      <div class="display-dimmer" id="displayDimmer" aria-hidden="true"></div>
      <div class="toast" id="toast" role="status"></div>
    </div>
  </div>

  <template id="window-template">
    <section class="mac-window" data-app-window="" aria-label="">
      <header class="window-titlebar drag-handle">
        <div class="traffic-lights" aria-label="Window controls">
          <button class="traffic close" data-window-action="close" aria-label="Close"></button>
          <button class="traffic minimize" data-window-action="minimize" aria-label="Minimize"></button>
          <button class="traffic zoom" data-window-action="zoom" aria-label="Zoom"></button>
        </div>
        <div class="window-title"></div>
        <div class="window-title-spacer"></div>
      </header>
      <div class="window-body"></div>
      <div class="resize-grip" aria-hidden="true"></div>
    </section>
  </template>

  <script src="site-content.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
